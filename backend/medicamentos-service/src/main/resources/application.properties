spring.application.name=medicamentos-service
server.port=8082

# Base de datos MySQL local (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/sanmarcos_medicamentos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: el esquema lo crea Flyway, Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion
spring.flyway.baseline-on-migrate=true

# Registro en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Documentacion Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT: JWT_SECRET es obligatorio (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
