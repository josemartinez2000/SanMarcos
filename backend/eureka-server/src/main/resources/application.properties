spring.application.name=eureka-server
server.port=8761

# El servidor Eureka no se registra a si mismo ni consulta el registro
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Autopreservacion desactivada por defecto en desarrollo (activar con EUREKA_SELF_PRESERVATION=true)
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
