spring.application.name=fichas-service
server.port=8084

# Base de datos MySQL (valores por defecto solo para desarrollo local con XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/sanmarcos_fichas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: el esquema lo crea Flyway, Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Registro en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Documentacion Swagger / OpenAPI (desactivar en produccion con SWAGGER_ENABLED=false)
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT: JWT_SECRET es obligatorio (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
